<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 설계 맵</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ec; --muted: #8b93a3;
    --accent: #6ea8fe; --done: #3fb27f; --review: #e0a23b; --dropped: #5b6170;
    --button: #222733; --panel-hover: #1d212b; --on-accent: #0b0d12; --danger: #e5534b; --danger-text: #ff8b84;
    --dropped-text: #6b7280; --edge: #3a4050; --edge-hover: #566079;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--button); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger-text); }
  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  .legend { display: flex; gap: 12px; margin-left: auto; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .status-done { background: var(--done); }
  .status-review { background: var(--review); }
  .status-dropped { background: var(--dropped); }
  #save { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
  main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  #net { min-height: 0; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; }
  aside h2 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
  aside label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  aside textarea { min-height: 220px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .hint { color: var(--muted); font-size: 12px; }
  .hint kbd { background: var(--button); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  #login { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  #login form { width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  #login h1 { font-size: 16px; margin: 0 0 16px; }
  #login button { width: 100%; margin-top: 12px; background: var(--accent); color: var(--on-accent); border: 0; padding: 9px; font-weight: 600; }
  #err { color: var(--danger-text); font-size: 12px; min-height: 18px; margin-top: 8px; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form>
    <h1>게임 설계 맵</h1>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
    <button>로그인</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>게임 설계 맵</h1>
    <button id="add" title="선택한 노드 아래에 추가 (N)">+ 노드</button>
    <button id="link" title="노드에서 노드로 드래그해서 연결 (L)">연결</button>
    <button id="fit" title="전체 보기 (F)">전체 보기</button>
    <div class="legend">
      <span><i class="status-done"></i>확정</span>
      <span><i class="status-review"></i>검토 중</span>
      <span><i class="status-dropped"></i>제외</span>
    </div>
    <span id="save"></span>
    <button id="logout">로그아웃</button>
  </header>
  <main>
    <div id="net"></div>
    <aside>
      <div id="empty">
        <h2>노드를 선택하세요</h2>
        <p class="hint">
          클릭: 선택 · 드래그: 이동 · 빈 곳 더블클릭: 새 노드<br>
          <kbd>N</kbd> 하위 노드 추가 · <kbd>L</kbd> 연결 모드 · <kbd>F</kbd> 전체 보기 · <kbd>Del</kbd> 선택 삭제
        </p>
      </div>
      <div id="edit" hidden>
        <h2 id="kind"></h2>
        <label for="f-label">이름</label>
        <input id="f-label">
        <label for="f-status">상태</label>
        <select id="f-status">
          <option value="done">확정</option>
          <option value="review">검토 중</option>
          <option value="dropped">제외</option>
        </select>
        <label for="f-detail">설명</label>
        <textarea id="f-detail"></textarea>
        <div class="row"><button id="del" class="danger">삭제</button></div>
      </div>
    </aside>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
// the graph library draws on a canvas: it takes the stylesheet's colours by value
const css = name => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
const COLOR = { done: css("done"), review: css("review"), dropped: css("dropped") };
const KIND = {
  root:  { shape: "box", size: 20, font: 18, margin: 14, name: "중심" },
  group: { shape: "box", size: 16, font: 15, margin: 10, name: "그룹" },
  item:  { shape: "dot", size: 9,  font: 13, margin: 0,  name: "항목" },
};
let net, nodes, edges, selected = null, selectedEdge = null, saveTimer;

function style(n) {
  const k = KIND[n.kind] || KIND.item, c = COLOR[n.status] || COLOR.review, box = k.shape === "box";
  return {
    ...n, shape: k.shape, size: k.size, margin: k.margin, title: undefined,
    color: { background: box ? css("panel") : c, border: c, highlight: { background: box ? css("button") : c, border: css("accent") }, hover: { background: box ? css("panel-hover") : c, border: c } },
    borderWidth: box ? 2 : 0, borderWidthSelected: 3,
    font: { size: k.font, color: css(n.status === "dropped" ? "dropped-text" : "text"), face: "Apple SD Gothic Neo, Noto Sans KR, sans-serif" },
    opacity: n.status === "dropped" ? 0.55 : 1,
  };
}
const plain = n => ({ id: n.id, label: n.label, kind: n.kind, status: n.status, detail: n.detail || "", x: n.x, y: n.y });

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body && JSON.stringify(body) });
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  return r;
}

function save() {
  $("save").textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const pos = net.getPositions();
    const data = {
      nodes: nodes.get().map(n => ({ ...plain(n), x: Math.round(pos[n.id]?.x ?? 0), y: Math.round(pos[n.id]?.y ?? 0) })),
      edges: edges.get().map(e => ({ from: e.from, to: e.to })),
    };
    try {
      const r = await api("PUT", "/api/map", data);
      $("save").textContent = r.ok ? "저장됨" : "저장 실패";
    } catch { $("save").textContent = "저장 실패"; }
  }, 500);
}

function select(id) {
  selected = id ? nodes.get(id) : null;
  $("empty").hidden = !!selected; $("edit").hidden = !selected;
  if (!selected) return;
  $("kind").textContent = (KIND[selected.kind] || KIND.item).name;
  $("f-label").value = selected.label;
  $("f-status").value = selected.status;
  $("f-detail").value = selected.detail || "";
}

function update(field, value) {
  if (!selected) return;
  selected = { ...plain(selected), [field]: value };
  nodes.update(style(selected));
  save();
}

function addNode(pos) {
  const id = "n" + Date.now().toString(36);
  const parent = selected?.id;
  const p = pos || (parent ? (b => ({ x: b.x + 160, y: b.y + 60 }))(net.getPosition(parent)) : { x: 0, y: 0 });
  nodes.add(style({ id, label: "새 노드", kind: "item", status: "review", detail: "", x: p.x, y: p.y }));
  if (parent && !pos) edges.add({ from: parent, to: id });
  net.selectNodes([id]); select(id); save();
  $("f-label").select(); $("f-label").focus();
}

function delSelected() {
  if (!selected || selected.kind === "root") return;
  if (!confirm(`"${selected.label}" 노드를 삭제할까요?`)) return;
  edges.remove(edges.get({ filter: e => e.from === selected.id || e.to === selected.id }).map(e => e.id));
  nodes.remove(selected.id); select(null); save();
}

function toggleLink(on = !$("link").classList.contains("on")) {
  $("link").classList.toggle("on", on);
  on ? net.addEdgeMode() : net.disableEditMode();
}

async function start() {
  const r = await api("GET", "/api/map");
  const data = await r.json();
  const placed = data.nodes.every(n => typeof n.x === "number");
  nodes = new vis.DataSet(data.nodes.map(style));
  edges = new vis.DataSet(data.edges);
  $("login").hidden = true; $("app").hidden = false;
  net?.destroy();
  net = new vis.Network($("net"), { nodes, edges }, {
    physics: placed ? false : { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -60, springLength: 110 }, stabilization: { iterations: 400 } },
    edges: { color: { color: css("edge"), highlight: css("accent"), hover: css("edge-hover") }, width: 1.5, smooth: { type: "continuous" }, selectionWidth: 1 },
    interaction: { hover: true, multiselect: false, keyboard: false },
    manipulation: { enabled: false, addEdge: (e, cb) => { if (e.from !== e.to && !edges.get({ filter: x => x.from === e.from && x.to === e.to }).length) { cb(e); save(); } toggleLink(false); } },
  });
  if (!placed) net.once("stabilizationIterationsDone", () => { net.setOptions({ physics: false }); save(); });
  net.on("click", p => select(p.nodes[0] || null));
  net.on("doubleClick", p => { if (!p.nodes.length && !p.edges.length) addNode(p.pointer.canvas); });
  net.on("dragEnd", p => { if (p.nodes.length) save(); });
  net.on("selectEdge", p => { if (!p.nodes.length) selectedEdge = p.edges[0]; });
  net.on("deselectEdge", () => selectedEdge = null);
}

function showLogin() { $("app").hidden = true; $("login").hidden = false; $("pw").value = ""; $("pw").focus(); }

$("login").querySelector("form").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
  $("err").textContent = r.ok ? "" : r.status === 429 ? "5번 틀려서 5분 동안 잠겼어요." : "비밀번호가 틀렸어요.";
  if (r.ok) start();
};
$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.reload(); };
$("add").onclick = () => addNode();
$("link").onclick = () => toggleLink();
$("fit").onclick = () => net.fit({ animation: { duration: 400 } });
$("del").onclick = delSelected;
$("f-label").oninput = e => update("label", e.target.value || " ");
$("f-status").onchange = e => update("status", e.target.value);
$("f-detail").oninput = e => update("detail", e.target.value);

document.addEventListener("keydown", e => {
  if ($("app").hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === "n") addNode();
  else if (k === "l") toggleLink();
  else if (k === "f") net.fit({ animation: { duration: 400 } });
  else if (k === "escape") toggleLink(false);
  else if (k === "delete" || k === "backspace") {
    if (selected) delSelected();
    else if (selectedEdge) { edges.remove(selectedEdge); selectedEdge = null; save(); }
  }
});

start().catch(() => {});
</script>
</body>
</html>
